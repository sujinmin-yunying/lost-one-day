[1,'help','薄荷汽水','10-17 16:40','求一个老式网页计数器，最好能显示小星星','以前主页底下有那种闪闪的计数器，鼠标移过去还会转。谁有备份？我想给自己的主页换个装修。顺便问一句，访客记录是不是可以改日期？','求助',[['网页小工','可以，搜搜早期的 CGI counter。日期一般不建议乱改。']],5],
[2,'help','河边的灯','10-17 23:48','我家的电话最近总有忙音','不是欠费，也不是线路坏了。每到晚上就会听见拨号音，接起来却没人说话。家里人说是旧线路串线。有没有懂电话的朋友？','求助',[['维修站老陈','先让电信局检查线路吧。'],['旧网民','忙音不等于有人拨号。你有听见过对方挂断吗？']],8],
[3,'love','匿名投递','10-18 20:15','给那个总借我蓝色圆珠笔的人','笔还在我这里。笔帽被你咬出了牙印，我一直没舍得扔。你说等暑假结束就来拿，可是后来再也没见到你。','匿名',[['路过的人','蓝色的笔是不是很容易漏墨？'],['匿名投递','你也记得它漏墨。']],18],
[4,'love','雨停之前','10-19 00:06','如果你还留着那张车票','不要把它丢掉。背面有我写的地址，不是我现在住的地方，是以前那个。要是哪天你不知道该去哪儿，就沿着那条路走一遍。','匿名',[['小树','以前的地址现在还有人住吗？']],12],
[5,'ghost','404小猫','10-18 02:13','梦见一间没有门的教室','窗外一直在下雨，桌上摆着几杯已经凉掉的水。所有人都说我来晚了，但我明明记得自己一直坐在靠窗的位置。','怪谈',[['睡不醒','是不是最近压力太大了。'],['纸月亮','你说的靠窗，是不是对着操场那边？']],21],
[6,'ghost','晚班车','10-19 01:32','有人也接到过没有声音的电话吗','接通后什么都听不到，只能听见远处有人拖动椅子的声音。挂断后，家里电话上显示的时间居然不对。','异常',[['旧电话簿','老机器的时钟经常不准。'],['晚班车','那为什么我听见有人叫我的旧网名？']],16],
[7,'cafe','蓝屏也浪漫','10-16 18:22','收了一台旧电脑，桌面壁纸居然是海','卖家说是亲戚留下的。开机没有密码，桌面只有一个网页快捷方式，标题叫“回家”。点进去是空白页。壁纸右下角有个很小的日期，我看不清。','闲聊',[['软盘收藏家','先别格式化，老硬盘有时候比人记性好。']],14],
[8,'cafe','泡泡堂老玩家','10-17 13:10','有没有人还记得当年网吧的泡面味','每次闻到红烧牛肉面就想起放学后去网吧的日子。老板总把收音机开得很响，雨天还会拿盆接屋顶漏下来的水。突然有点想念。','闲聊',[['北方人','老板是不是还会拿塑料袋套鼠标？']],33],
[9,'diary','玻璃海','10-18 22:02','主页音乐换成了很久以前的那首歌','今天把背景音乐换回旧版本，突然发现留言板上有条留言不见了。记得那个人每次来都会打错一个字，后来我才知道那是他故意的。','日记',[['猫耳朵','是什么字？我也想玩这种小把戏。']],11],
[10,'diary','小雨转晴','10-19 09:30','今天去了一趟以前的学校','门口的梧桐树还在，传达室换了新玻璃，操场边那面墙被刷白了。我在门口站了一会儿，想不起自己到底在等谁。','日记',[['玻璃海','有时候是地方记得你，你不一定记得它。']],26],
[11,'chat','奶油夹心','10-17 19:09','灌水：你们写字的时候会不会把某个字写错','我写“再见”总会多写一横，改了好多次也没改掉。朋友说像是故意留个记号。哪有那么玄乎，单纯手笨而已。','水贴',[['旧书签','我总把“回”字写得特别扁。'],['奶油夹心','哈哈那你们俩可以组个错别字联盟。']],19],
[12,'chat','青苹果','10-18 12:41','今天吃什么？在线等','食堂的饭又咸了。有人会做番茄炒蛋吗？我每次都把糖放成盐。今天还捡到一张不知道谁的公交卡，明天交给失物招领。','水贴',[['三明治','糖盐都放一点，叫命运的味道。']],7],
[13,'chat','站务-小禾','10-18 23:50','关于最近频繁出现的旧地址','请大家不要反复填写已经停用的地址。旧资料迁移后会自动清理。也不要再拿以前的用户名互相开玩笑了。','站务',[['雨停之前','可是有些地址并不是停用了。'],['站务-小禾','我知道。']],4],
[14,'lost','南方来信','10-17 17:28','捡到一张旧车票，日期已经褪色','票面看不清目的地，只能辨认出车站名字的最后一个字。背面有人用蓝笔写了地址，字迹很奇怪，像是写到一半又换了个人。','失物',[['匿名投递','蓝色圆珠笔容易漏墨。']],13],
[15,'lost','旧相册','10-18 15:20','帮忙认一下照片里的地方','照片上是一排梧桐树，后面有旧校舍。有人说是北边的学校，也有人说是早就拆掉的文化宫。我只记得那天下了很大的雨。','寻物',[['小雨转晴','梧桐树还在，校舍未必。']],17],
[16,'market','小行星碎片','10-16 16:43','出售一批旧磁盘，不保证能读','清理仓库发现几张软盘，标签都掉了。里面有网页素材、聊天记录，还有一份文件反复提示权限不足。想要的私信。','二手',[['软盘收藏家','别用新电脑直接写入，先做只读镜像。']],6],
[17,'market','耳机只有一边响','10-17 11:14','收一个随身听，外壳旧一点没关系','只要能听磁带就行。最好是银色的，按键有点松也无所谓。想找回以前听歌的感觉。','二手',[['青苹果','我家抽屉里有一个，不过磁带好像还卡在里面。']],3],
[18,'help','小鱼干','10-19 10:16','请问网页留言板能不能看到删掉的留言','昨天有人留言，今天再看就没有了。不是管理员删的，留言的时间也没有变。我记得内容里有一句“地址还在”，但找不到原帖。','求助',[['网页小工','有些旧系统会把被覆盖的内容留在缓存里。']],9],
[19,'diary','雨衣口袋','10-19 18:12','整理书包，发现一张没用过的纸','上面写着“别把伞还给我”。我不认识这句话，也不记得有借过别人伞。纸张已经发黄了，边缘有一点蓝色墨水。','日记',[['河边的灯','如果你不记得，也许先留着吧。']],20],
[20,'chat','网页小工','10-19 21:44','关于旧站的缓存，我有一个猜测','旧站迁移的时候，有些帖子被复制了，有些只保留了回复。我们以为是删除，其实原文可能还在别人的引用里。别急着下结论，先把同一件事出现过的地方找齐。','水贴',[['站务-小禾','不要把猜测写成公告。'],['网页小工','那就当我没说。']],22],
[21,'ghost','走廊尽头','10-19 23:01','有人知道旧站为什么没有首页了吗','我记得首页上有一张海边的照片，点照片会进入一间聊天室。现在只剩下一个空白页。管理员说从来没有过那张照片。','异常',[['蓝屏也浪漫','我见过那张图，海边有个红色的电话亭。']],15],
[22,'lost','旧相册','10-19 23:37','照片背后有一句话，谁能看懂','“等雨停了，我们就回去。”后面的字被水泡开了，只能看到最后像是一个人的名字，又像一处地名。','寻物',[['玻璃海','也许不是名字。你有把照片晾干吗？']],14]
].map(x=>({id:x[0],b:x[1],u:x[2],date:x[3],title:x[4],body:x[5],tag:x[6],replies:x[7],likes:x[8]}));
let posts=[];
const clues={
1:['留言板的旧地址','同一段地址在求助帖里被称为“停用地址”，在表白信里却被说成“回去的地方”。先不要判断它属于谁。','这个地址更像什么？',['一处真实地点','论坛服务器地址','某个人编造的地名'],0,'暂时保留“真实地点”这个假设。旧车票和校园照片可能提供交叉验证。'],
3:['蓝色圆珠笔','表白信提到一支漏墨的蓝色笔。寻物帖里的车票背面也是蓝色墨水，日记里的纸张边缘同样留有蓝色痕迹。','最值得先验证的共同点是什么？',['笔的品牌','同一支笔是否被不同人拿过','帖子是不是同一天发布'],1,'笔的流转可能把不同作者联系起来，但不能据此断定他们是同一个人。'],
7:['海边的主页','旧电脑壁纸、旧站首页和一条怪谈都提到海边。每个人描述的细节不同：空白页、红色电话亭、无法打开的快捷方式。','接下来应该优先寻找什么？',['更多关于海边的形容词','能验证地点的具体物件或旧记录','把所有描述当成同一个梦'],1,'可以验证的物件比相似的气氛更可靠。红色电话亭和车站名称可能是关键。'],
10:['被改写的记忆','有人记得学校还在，有人只记得一场大雨；有人回去过，却想不起自己在等谁。记忆并不完全一致。','哪种解释目前最稳妥？',['所有人都在说谎','地点发生变化，而记忆保留了不同片段','这一定是超自然现象'],1,'地点变化、记忆偏差和有意隐瞒都仍然可能。还需要找出当年究竟发生了什么。'],

let page='home',filter=null,term='',detail=null,activePuzzle=null;let evidence=new Set(),solved=new Set(),saved=new Set(),theories=[];
function loadPersonalData(){
 if(!currentUser)return;
 storageKey='vanished_day_user_'+currentUser.id;
 let d=null; try{d=JSON.parse(localStorage.getItem(storageKey)||'null')}catch(e){}
 posts=seedPosts.map(p=>({...p,replies:p.replies.map(r=>[...r])}));
 if(d&&Array.isArray(d.posts)){const savedPosts=new Map(d.posts.map(p=>[p.id,p]));posts=posts.map(p=>savedPosts.has(p.id)?savedPosts.get(p.id):p);for(const p of d.posts){if(!posts.some(x=>x.id===p.id))posts.push(p)}}
 saved=new Set(d?.saved||[]);evidence=new Set(d?.evidence||[]);solved=new Set(d?.solved||[]);theories=d?.theories||[];
}
function persist(){if(!currentUser||!storageKey)return;try{localStorage.setItem(storageKey,JSON.stringify({posts,saved:[...saved],evidence:[...evidence],solved:[...solved],theories}))}catch(e){alert('本地保存失败，可能是浏览器存储空间不足。')}}
function updateAuthBar(){const st=$('#accountStatus'),lb=$('#loginBtn'),ob=$('#logoutBtn');if(!st)return;if(currentUser){st.textContent='已登录：'+currentUser.email+' · 内容仅保存在此浏览器';lb.style.display='none';ob.style.display='inline-block'}else{st.textContent='访客模式：可浏览全部帖子；登录后可保存个人互动记录';lb.style.display='inline-block';lb.textContent='登录 / 注册';ob.style.display='none'}}
function authModal(mode='login'){$('#modal').innerHTML=`<div class="modal"><div class="dialog"><div class="sub">OLD INTERNET ACCOUNT · LOCAL ONLY</div><h2>${mode==='signup'?'注册旧站账号':'登录旧站'}</h2><p class="note">这是本地个人账号，不会连接云端。账号、帖子、回复、收藏和调查进度只保存在当前浏览器中；换浏览器或设备不会同步。请勿使用重要网站的密码。</p><form id="authForm" data-mode="${mode}"><div class="field"><label>邮箱（用于识别账号）</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>密码（至少 6 位）</label><input id="authPassword" type="password" minlength="6" autocomplete="${mode==='signup'?'new-password':'current-password'}" required placeholder="请输入密码"></div><div id="authMessage" class="note"></div><div class="actions"><button class="btn" type="button" data-action="close">取消</button><button class="btn" type="button" data-authmode="${mode==='signup'?'login':'signup'}">${mode==='signup'?'已有账号？去登录':'没有账号？注册'}</button><button class="btn dark" type="submit">${mode==='signup'?'注册':'登录'}</button></div></form></div></div>`}
async function passwordHash(password){const bytes=new TextEncoder().encode(password);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function readAccounts(){try{return JSON.parse(localStorage.getItem(ACCOUNT_KEY)||'[]')}catch(e){return []}}
function saveAccounts(accounts){localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts))}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),board=id=>boards.find(b=>b.id===id)||boards[0];
function card(p){return `<article class="post"><div class="posttop"><div><div class="user">${esc(p.u)}</div><div class="meta">${esc(p.date)} · ${esc(board(p.b).name)}</div></div><span class="tag ${p.b==='ghost'?'odd':''}">${esc(p.tag)}</span></div><button class="posttitle" data-open="${p.id}">${esc(p.title)}</button><div class="body">${esc(p.body)}</div><div class="foot"><span>☷ ${p.replies.length} 条回复</span><span><button class="textbtn" data-like="${p.id}">♡ ${p.likes}</button><button class="textbtn" data-save="${p.id}">${saved.has(p.id)?'★ 已收藏':'☆ 收藏'}</button><button class="textbtn" data-open="${p.id}">查看全文 →</button></span></div></article>`}
function grid(){return `<div class="boards">${boards.map(b=>`<button class="board" data-board="${b.id}"><span style="float:right;color:#888;font-size:10px">${evidence.has(b.id)?'● 有发现':'○'}</span><span class="ico">${b.ico}</span><b>${b.name}</b><small>${b.en}<br>${b.desc}</small></button>`).join('')}</div>`}
function home(){return `<div class="hero"><div class="eyebrow">RECOVERED HOMEPAGE · UNKNOWN OWNER</div><h1>你回来得太晚了。<br>不过，旧站还在。</h1><p>有人说这里从来没有发生过什么。有人说自己曾经在这里等了很久。旧帖互相引用，却找不到最初的那篇。</p><p>你可以先逛逛，发点无聊的帖子，或者看看大家都在聊什么。不要急着寻找答案——有些线索看起来一点也不像线索。</p><button class="btn" data-action="write">＋ 发一条新帖</button> <button class="btn" data-page="boards">随便逛逛 →</button><div class="ghost">HOME</div></div><div class="heading">▦ 随便看看 <small>旧站版块</small></div>${grid()}<div class="heading">☷ 刚刚有人说 <small>最近的帖子</small></div>${[12,8,2,19].map(id=>card(posts.find(p=>p.id===id)).join?card(posts.find(p=>p.id===id)):card(posts.find(p=>p.id===id))).join('')}`}
function list(){let arr=posts.filter(p=>(!filter||p.b===filter)&&(!term||(p.title+' '+p.body+' '+p.u+' '+board(p.b).name).toLowerCase().includes(term.toLowerCase()))&&(page!=='saved'||saved.has(p.id)));if(page==='latest')arr.sort((a,b)=>b.id-a.id);return `${filter?`<div class="inset"><b>${board(filter).ico} ${esc(board(filter).name)}</b><p class="body">${esc(board(filter).desc)}</p><button class="btn" data-action="write">＋ 在本版发帖</button></div>`:''}<div class="heading">${filter?esc(board(filter).name):page==='saved'?'我的收藏':'帖子列表'} <small>${arr.length} 条记录</small></div>${arr.length?arr.map(card).join(''):'<div class="inset">没有找到相关帖子。<br><button class="btn" data-action="write">发一条新帖</button></div>'}`}
function notes(){return `<div class="panel"><b>调查笔记 / WORKING THEORY</b><br><small>不要把推测当作事实。记录相互印证的内容，也记录暂时解释不了的矛盾。</small></div><div class="heading">已发现的关联 <small>${evidence.size} 条记录</small></div>${evidence.size?[...evidence].map(id=>`<div class="evidence"><b>${esc(clues[id][0])}</b><small>${esc(clues[id][1])}</small><div style="margin-top:8px"><button class="btn" data-puzzle="${id}">${solved.has(id)?'✓ 已完成推理':'继续调查 →'}</button></div></div>`).join(''):'<div class="inset"><p class="body">目前还没有形成明确的关联。先去各个版块逛逛，看看哪些帖子值得收藏、哪些话出现过不止一次。</p></div>'}<div class="heading">你的推测 <small>可以随时补充</small></div><div class="inset"><textarea id="theory" class="input" style="min-height:85px" placeholder="我觉得那张车票可能和旧地址有关，因为……"></textarea><button class="btn" data-action="theory" style="margin-top:8px">记下这个想法</button>${theories.map(t=>`<div class="reply"><p>${esc(t)}</p></div>`).join('')}</div><div class="heading">最后的旧文件</div><div class="inset"><p class="body">有一份旧站备份没有被完整恢复。它不接受数字编号，也不接受随便拼出来的密码。你需要弄清楚：当年谁在等人，谁改掉了地址，以及为什么每个人都记得不同的结局。</p><button class="btn dark" data-action="final">尝试打开备份</button></div>`}
function thread(p){return `<button class="btn" data-action="back">← 返回</button><div style="margin-top:10px">${card(p)}</div><div class="heading">回复与引用 <small>${p.replies.length} 条</small></div>${p.replies.map(r=>`<div class="reply"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}<div class="reply"><b>回复此帖</b><div style="display:flex;gap:6px;margin-top:8px"><input id="replyText" class="input" maxlength="400" placeholder="说点什么……"><button class="btn" data-action="reply" data-id="${p.id}">回复</button></div></div>${clues[p.id]?`<div class="inset"><b>这篇帖子值得仔细想想</b><p class="body">它可能与其他帖子存在关联。回答阶段性问题，记录自己的判断；答案不会直接告诉你整个事件的真相。</p><button class="btn dark" data-puzzle="${p.id}">整理这条记录</button></div>`:''}`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let p=posts.find(p=>p.id===detail);$('#view').innerHTML=detail&&p?thread(p):page==='home'?home():page==='boards'?grid():page==='notes'?notes():list()}
function puzzle(id){let c=clues[id];if(!c)return;activePuzzle=id;evidence.add(id);persist();$('#modal').innerHTML=`<div class="modal"><div class="dialog"><div class="sub">INVESTIGATION NOTE</div><h2>${esc(c[0])}</h2><p class="body">${esc(c[1])}</p><div class="line"></div><b>${esc(c[2])}</b>${c[3].map((o,i)=>`<div style="margin-top:8px"><button class="btn" style="width:100%;text-align:left;white-space:normal" data-answer="${i}">${esc(o)}</button></div>`).join('')}<p class="note">这是阶段性判断。后续证据可能改变你的结论。</p><div class="actions"><button class="btn" data-action="close">稍后再说</button></div></div></div>`}
function answer(i){let c=clues[activePuzzle];solved.add(activePuzzle);persist();$('#modal').innerHTML=`<div class="modal"><div class="dialog"><div class="sub">FIELD NOTE SAVED</div><h2>${i===c[4]?'这个方向值得继续。':'这也许是个误判。'}</h2><p class="body">${esc(c[5])}</p><p class="note">这条记录已加入调查笔记。一个正确的推断不等于整个事件的真相。</p><div class="actions"><button class="btn" data-action="close">继续调查</button><button class="btn dark" data-action="notes">查看笔记</button></div></div></div>`}
function write(){if(!currentUser){authModal();return}let def=filter||'chat';$('#modal').innerHTML=`<div class="modal"><div class="dialog"><h2>✎ 发一条新帖</h2><p class="note">你可以问问题、发牢骚、分享旧物，也可以留下别人以后会看到的话。</p><form id="postForm"><div class="field"><label>版块</label><select id="postBoard">${boards.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div><div class="field"><label>网名</label><input id="postUser" maxlength="30" value="${esc((currentUser.email||'旧站访客').split('@')[0])}"></div><div class="field"><label>标题</label><input id="postTitle" required maxlength="100" placeholder="标题不用太认真"></div><div class="field"><label>内容</label><textarea id="postBody" required maxlength="2500" placeholder="最近发生了什么？"></textarea></div><div class="actions"><button class="btn" type="button" data-action="close">取消</button><button class="btn dark" type="submit">发布</button></div></form></div></div>`;$('#postBoard').value=def}
function finalDoc(){if(solved.size<5){$('#modal').innerHTML=`<div class="modal"><div class="dialog"><h2>文件仍无法完整读取</h2><p class="body">你已经有了一些线索，但它们还没有组成足够可靠的解释。试着继续寻找不同作者之间的联系，不要只盯着看起来最奇怪的帖子。</p><p class="note">求助帖、旧物、留言板和闲聊里的日常细节，可能比怪谈本身更接近真相。</p><div class="actions"><button class="btn" data-action="close">返回</button><button class="btn dark" data-action="notes">整理笔记</button></div></div></div>`;return}
$('#modal').innerHTML=`<div class="modal"><div class="dialog"><div class="sub">RESTORED COPY · PARTIAL</div><h2>旧站迁移记录</h2><div class="inset"><b>记录一：原始地址</b><p class="body">旧站并非建在一所学校里。它最初只是几个人共同维护的个人主页集合。后来，其中一人把主页入口改成了海边照片，并把所有人的留言板链接放在照片背后。</p><b>记录二：那场雨</b><p class="body">那年，老城区准备搬迁。有人把聚会地点写在旧站上，却没有更新纸质通知。雨夜里，几个人去了旧地址，另一些人去了新地址。没有人知道对方去了哪里。电话线路故障，留言又在站点迁移时被覆盖。此后，每个人都以为是自己被放了鸽子。</p><b>记录三：被隐藏的原文</b><p class="body">管理员没有删除所有帖子。他试图保护一位网友的隐私，把原文移走，却保留了回复。其他人以为那个人突然消失，有人开始编造怪谈，也有人把自己的记忆填进了空白。</p><b>记录四：最后一条留言</b><p class="body">“我回去过。树还在，房子没了。我把地址写在车票背面，怕以后连自己都忘记。要是你们还记得，就不用来找我了。我们不是没有见到彼此，只是一直走在不同的路上。”</p><b>附注：无法确认的作者</b><p class="body">恢复者访问旧站时，系统自动填入了一个从未注册过的旧网名。它与当前访问者的昵称相同。</p><p class="body">档案末尾有一行没有被覆盖的字：你终于回来了。只是这里已经没有人了。</p></div><p class="note">这份文档仍有缺页。它解释了部分旧站记录，却无法证明每个网友的回忆都是真的。</p><div class="actions"><button class="btn" data-action="close">关闭</button><button class="btn dark" data-action="notes">返回调查笔记</button></div></div></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
if(b.dataset.authmode){authModal(b.dataset.authmode);return}
if(b.id==='loginBtn'){authModal('login');return}
if(b.id==='logoutBtn'){persist();currentUser=null;storageKey=null;posts=seedPosts.map(p=>({...p,replies:p.replies.map(r=>[...r])}));saved=new Set();evidence=new Set();solved=new Set();theories=[];updateAuthBar();render();return}
if(b.dataset.action==='auth'){authModal('login');return}
if(!currentUser && (b.dataset.action==='write'||b.dataset.action==='reply'||b.dataset.action==='theory'||b.dataset.like||b.dataset.save||b.dataset.puzzle||b.dataset.answer!==undefined)){authModal('login');return}
if(b.dataset.page){page=b.dataset.page;filter=null;detail=null;term='';$('#query').value='';render();return}
if(b.dataset.board){filter=b.dataset.board;page='latest';detail=null;render();return}
if(b.dataset.open){detail=+b.dataset.open;render();return}
if(b.dataset.save){let id=+b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);persist();render();return}
if(b.dataset.like){let p=posts.find(p=>p.id===+b.dataset.like);if(p)p.likes++;persist();render();return}
if(b.dataset.puzzle){puzzle(+b.dataset.puzzle);return}
if(b.dataset.answer!==undefined){answer(+b.dataset.answer);return}
let a=b.dataset.action;if(a==='close')$('#modal').innerHTML='';if(a==='write')write();if(a==='back'){detail=null;render()}if(a==='notes'){page='notes';detail=null;$('#modal').innerHTML='';render()}if(a==='final')finalDoc();
if(a==='theory'){let v=$('#theory')?.value.trim();if(v){theories.unshift(v);persist();render()}}
if(a==='reply'){let p=posts.find(p=>p.id===+b.dataset.id),v=$('#replyText')?.value.trim();if(p&&v){p.replies.push([(currentUser.email||'旧站访客').split('@')[0],v]);persist();render()}}
});
document.addEventListener('submit',async e=>{if(e.target.id==='authForm'){e.preventDefault();const email=$('#authEmail').value.trim().toLowerCase(),password=$('#authPassword').value,mode=e.target.dataset.mode==='signup'?'signup':'login';const msg=$('#authMessage');msg.textContent='正在处理……';try{if(password.length<6)throw new Error('密码至少需要 6 位。');const accounts=readAccounts();const found=accounts.find(a=>a.email===email);const hash=await passwordHash(password);if(mode==='signup'){if(found)throw new Error('这个邮箱已经注册过，请直接登录。');const account={id:'u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),email,hash};accounts.push(account);saveAccounts(accounts);currentUser={id:account.id,email:account.email};}else{if(!found||found.hash!==hash)throw new Error('邮箱或密码不正确；如果还没有账号，请先注册。');currentUser={id:found.id,email:found.email};}loadPersonalData();updateAuthBar();$('#modal').innerHTML='';render()}catch(err){msg.textContent=err.message||'操作失败，请重试。'}return}if(e.target.id!=='postForm')return;e.preventDefault();let title=$('#postTitle').value.trim(),body=$('#postBody').value.trim();if(!currentUser){authModal();return}if(!title||!body)return;posts.push({id:Math.max(0,...posts.map(p=>p.id))+1,b:$('#postBoard').value,u:$('#postUser').value.trim()||(currentUser.email||'旧站访客').split('@')[0],date:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),title,body,tag:'新帖',replies:[],likes:0});persist();filter=$('#postBoard').value;page='latest';detail=null;$('#modal').innerHTML='';render()});
$('#searchBtn').addEventListener('click',()=>{term=$('#query').value.trim();filter=null;page='latest';detail=null;render()});$('#query').addEventListener('keydown',e=>{if(e.key==='Enter')$('#searchBtn').click()});
$('#info').addEventListener('click',()=>{$('#modal').innerHTML=`<div class="modal"><div class="dialog"><h2>旧站信息</h2><div class="inset">SERVER: PERSONAL BBS<br>STATUS: PARTIAL RECOVERY<br>ARCHIVE OWNER: UNKNOWN</div><p class="note">这是一个复古论坛互动故事。账号通过本地浏览器验证；帖子、回复、点赞、收藏和调查进度只保存在当前浏览器本地。清理浏览器数据后，本地记录可能丢失；换设备不会自动同步。请勿使用重要网站的密码。</p><div class="actions"><button class="btn" data-action="close">关闭</button></div></div></div>`});
